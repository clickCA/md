name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # CI owns caching & environment setup; make owns the command definitions
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: make lint-js

      - name: Format check
        run: make format-check-js

      - name: Typecheck
        run: make typecheck

      - name: Install Playwright Chromium
        run: pnpm --filter md-app exec playwright install --with-deps chromium

      - name: Tests
        run: make test-js

      - name: Build
        run: make build-js

  landing:
    name: Landing (build · dist in sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: make build-landing

      # landing/dist is committed on purpose (see AGENTS.md) — fail when a
      # rebuild would change the committed tree, so src/docs edits that forget
      # `pnpm build:landing` can't land silently.
      - name: dist is in sync with src
        run: git diff --exit-code -- landing/dist

  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    # Tauri Linux prerequisites are baked into the CI builder image so each run
    # skips the apt-get dance (see docker/ci/Dockerfile; rebuilt by
    # .github/workflows/docker-ci.yml).
    #
    # The container pulls the private md-ci image, so the token needs packages
    # read — an explicit permissions block drops any scope you don't list, so
    # it must be repeated here (not only at workflow level).
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/clickca/md-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # One toolchain, pinned: rust-toolchain.toml selects 1.99.1, so install
      # exactly that (with the tools the gates need) instead of latest-stable,
      # which never compiles anything here — the old setup downloaded both.
      # Bump this ref in the same commit as a rust-toolchain.toml pin change.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: make format-check-rust

      - name: Clippy (warnings are errors)
        run: make lint-rust

      - name: Tests
        run: make test-rust
