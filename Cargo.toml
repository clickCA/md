[workspace]
resolver = "2"
members = ["crates/vault-core", "crates/vault-spike-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gix = { version = "0.89", features = [
    "revision",
    "worktree-mutation",
    "extras",
    "blocking-network-client",
] }
imara-diff = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
anyhow = "1"
