name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # CI owns caching & environment setup; make owns the command definitions
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: make lint-js

      - name: Format check
        run: make format-check-js

      - name: Typecheck
        run: make typecheck

      - name: Install Playwright Chromium
        run: pnpm --filter md-app exec playwright install --with-deps chromium

      - name: Tests
        run: make test-js

      - name: Build
        run: make build-js

  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    # Tauri Linux prerequisites are baked into the CI builder image so each run
    # skips the apt-get dance (see docker/ci/Dockerfile; rebuilt by
    # .github/workflows/docker-ci.yml).
    container:
      image: ghcr.io/clickca/md-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # the toolchain channel itself is pinned by rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # the pinned toolchain is a separate install without components; add them
      - name: Toolchain components (rustfmt, clippy)
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: make format-check-rust

      - name: Clippy (warnings are errors)
        run: make lint-rust

      - name: Tests
        run: make test-rust
