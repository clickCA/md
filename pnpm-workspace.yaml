  - '@vitest/browser@5.0.5'
  - '@vitest/mocker@5.0.5'
  - '@vitest/pretty-format@5.0.5'
  - '@vitest/spy@5.0.5'
  - '@vitest/ui@5.0.5'
  - '@vitest/utils@5.0.5'
  - vitest@5.0.5
