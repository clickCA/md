[workspace]
resolver = "2"
members = ["crates/vault-core", "md-app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Transport note: reqwest + rustls (pure Rust) instead of libcurl. curl-sys
# pulls no TLS backend on this target and won't do HTTPS reliably on Android;
# reqwest+rustls cross-compiles and runs cleanly there (clone-from-URL needs it).
gix = { version = "0.90", features = [
    "revision",
    "worktree-mutation",
    "extras",
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
] }
imara-diff = "0.2"
# Direct dep so vault-core can downcast rejected-credential errors to
# gix_transport::client::AuthenticationRequired (gix does not re-export
# gix-transport). No features needed — the type is always available.
gix-transport = { version = "0.62", default-features = false }
# `https` is required for `git2::Remote::push` over HTTPS: without it libgit2 is
# built with no TLS backend at all and every push fails with "there is no TLS
# stream available" (push is the one network op gix cannot do — gitoxide has no
# push implementation). OpenSSL is vendored so the Android cross-build has a
# TLS stack without depending on host libraries.
git2 = { version = "0.21", features = ["cred", "https", "vendored-openssl"] }
rusqlite = { version = "0.41", features = ["bundled"] }
tempfile = "3"
anyhow = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
