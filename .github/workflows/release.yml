# Desktop release builds — triggered by pushing a v* tag.
# Builds Linux (deb/rpm/AppImage) and Windows (msi/NSIS) bundles and
# attaches them to the GitHub release for that tag.
# Android APKs are built locally (see `make android`); NDK setup on CI is a
# follow-up.

name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            # universal binary — one .dmg covers Apple Silicon + Intel
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # macOS: build a universal binary (Apple Silicon + Intel)
      - name: Add macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # CI owns caching & environment setup; make owns the command definitions
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and attach bundles to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # the pushed tag decides the release — never derive it from the app
          # version (v__VERSION__), so pre-release tags like v0.1.0-alpha.1
          # get their bundles instead of spawning a full v0.1.0 release
          tagName: ${{ github.ref_name }}
          releaseName: "md ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: false
          args: ${{ matrix.args }}
