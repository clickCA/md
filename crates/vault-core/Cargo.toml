[package]
name = "vault-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gix = { workspace = true }
git2 = { workspace = true }
imara-diff = { workspace = true }
rusqlite = { workspace = true }
anyhow = { workspace = true }
# Only used on Android: builds the HTTP client from the on-device PEM trust
# store (see `android_tls` in gix_backend.rs) — reqwest's default rustls
# path selects `rustls-platform-verifier`, which needs a Gradle/JNI bridge
# Tauri apps don't have. Features mirror what gix-transport enables.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls",
] }

[dev-dependencies]
tempfile = { workspace = true }

# Android: libgit2's OpenSSL is built with `no-stdio` (openssl-src hardcodes it
# for this target), so it cannot read CA files — certs must be added in memory
# via `GIT_OPT_ADD_SSL_X509_CERT`. `d2i_X509` comes from the same OpenSSL that
# libgit2 links, and base64 decodes the on-device PEM trust store.
[target.'cfg(target_os = "android")'.dependencies]
libgit2-sys = "0.18"
base64 = "0.23"
